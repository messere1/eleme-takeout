spring:
  datasource:
    url: jdbc:h2:mem:take_out;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=20000
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 50

mybatis:
  configuration:
    map-underscore-to-camel-case: true
