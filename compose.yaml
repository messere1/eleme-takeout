version: "3.7"

services:
  postgres:
    image: postgres:16
    container_name: takeout-postgres

    environment:
      POSTGRES_DB: take_out
      POSTGRES_USER: take_out
      POSTGRES_PASSWORD: take_out
      TZ: Asia/Shanghai

    ports:
      # 使用 15432，避免与开发机上已有的 PostgreSQL 或其他容器冲突。
      - "15432:5432"

    volumes:
      # 数据卷保存
      - takeout-postgres-data:/var/lib/postgresql/data

      # 直接使用后端现有表结构文件
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

      # 稍后创建的演示数据
      - ./database/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U take_out -d take_out"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

  migrate:
    image: postgres:16
    depends_on:
      - postgres
    environment:
      PGPASSWORD: take_out
    volumes:
      - ./database/migrations/20260914_upgrade_existing_volume.sql:/migration.sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      until pg_isready -h postgres -U take_out -d take_out; do sleep 1; done;
      psql -h postgres -U take_out -d take_out -v ON_ERROR_STOP=1 -f /migration.sql
    restart: "no"

volumes:
  takeout-postgres-data:
